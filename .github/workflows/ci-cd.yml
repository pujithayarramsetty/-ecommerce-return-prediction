
name: E-Commerce Return Prediction CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Files
        run: |
          python -m py_compile app.py tests/test_app.py

      - name: Run Automated Tests
        run: |
          pytest -v

      - name: Build Docker Image
        run: |
          docker build -t ecommerce-return-prediction:latest .

      - name: Login to GitHub Container Registry
        if: success()
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish Docker Image
        if: success()
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag ecommerce-return-prediction:latest ghcr.io/${IMAGE_NAME}:latest
          docker push ghcr.io/${IMAGE_NAME}:latest
